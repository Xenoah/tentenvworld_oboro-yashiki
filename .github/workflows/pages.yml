name: Verify and deploy OBORO demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: oboro-pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [legacy, mission]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - run: npm run build:pages
      - run: npx playwright-core install --with-deps chromium
      - name: Browser verification under the Pages subpath
        env:
          OBORO_BROWSER_SUITE: ${{ matrix.suite }}
        run: |
          npm run preview:pages > /tmp/oboro-pages.log 2>&1 &
          npm run test:pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-validation-${{ matrix.suite }}
          path: evidence/pages/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: matrix.suite == 'mission'
        with:
          path: dist-pages
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
